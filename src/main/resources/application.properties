spring.application.name=baozistore

# H2 em memoria: some a cada restart, o que mantem os IDs previsiveis nos prints
spring.datasource.url=jdbc:h2:mem:baozistore;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
