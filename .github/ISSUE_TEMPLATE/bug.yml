name: Relatar um bug
description: Reporte um comportamento incorreto na API.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o resultado obtido e o esperado.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Informe método, rota, corpo de exemplo sem dados pessoais ou credenciais e passos.
      placeholder: |
        1. Inicie a API
        2. Envie POST /...
        3. Observe a resposta ...
    validations:
      required: true
  - type: input
    id: response
    attributes:
      label: Status HTTP
      placeholder: "Ex.: 400"
